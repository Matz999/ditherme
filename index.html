<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ditherme</title>
<style>
  :root{ --ink:#0c0c12; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#fff; overflow:hidden; }
  body{ font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink); }
  #stage{ position:relative; width:100vw; height:100vh; }
  #bg{ position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; image-rendering:crisp-edges; }

  /* center content */
  .center{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:34px; text-align:center; padding:24px;
    /* soft glow so the logo stays legible over the rainbow */
    background:radial-gradient(closest-side at 50% 46%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%); }
  .logo{ display:flex; align-items:center; gap:.18em; opacity:0; transform:translateY(14px) scale(.98);
    animation:rise .9s .15s cubic-bezier(.22,1,.36,1) forwards; }
  .logo .mark{ width:.82em; height:.82em; border-radius:.18em; flex:none;
    background:
      conic-gradient(from 210deg, #ff2e5b, #ff9e2c, #ffe64d, #35d07f, #2ea6ff, #9b5cff, #ff2e5b);
    box-shadow:0 8px 30px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.5); }
  .logo h1{ font-size:clamp(46px, 12vw, 132px); font-weight:800; letter-spacing:-.03em;
    line-height:.9; color:var(--ink); text-shadow:0 2px 30px rgba(255,255,255,.55); }
  .tag{ font-size:clamp(12px,2.6vw,15px); letter-spacing:.34em; text-transform:uppercase;
    font-weight:600; opacity:0; color:#33333f;
    animation:rise .9s .32s cubic-bezier(.22,1,.36,1) forwards; }

  .enter{ position:relative; font:inherit; font-size:clamp(15px,2.4vw,18px); font-weight:700;
    letter-spacing:.02em; color:var(--ink); text-decoration:none; cursor:pointer;
    padding:16px 30px; border-radius:18px; display:inline-flex; align-items:center; gap:12px;
    border:1px solid rgba(255,255,255,.7); background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(16px) saturate(180%); backdrop-filter:blur(16px) saturate(180%);
    box-shadow:0 12px 34px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.85);
    opacity:0; transform:translateY(14px);
    animation:rise .9s .5s cubic-bezier(.22,1,.36,1) forwards;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease; }
  .enter:hover{ transform:translateY(-3px); background:rgba(255,255,255,.6);
    box-shadow:0 18px 46px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.9); }
  .enter:active{ transform:translateY(0) scale(.98); }
  .enter .arrow{ transition:transform .18s ease; }
  .enter:hover .arrow{ transform:translateX(4px); }

  @keyframes rise{ to{ opacity:1; transform:translateY(0) scale(1); } }
  @media (prefers-reduced-motion:reduce){ .logo,.tag,.enter{ animation-duration:.01ms; } }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="bg"></canvas>
    <div class="center">
      <div class="logo"><span class="mark"></span><h1>ditherme</h1></div>
      <div class="tag">dithered artifact studio</div>
      <a class="enter" href="editor.html">Open the editor <span class="arrow">→</span></a>
    </div>
  </div>
<script>
(() => {
  const cv = document.getElementById('bg');
  const ctx = cv.getContext('2d');

  // ---- low-res dithered field, upscaled crisp ----
  let CW, CH, W, H, SCALE, img;
  const TARGET_W = 200;
  function resize(){
    CW = cv.clientWidth || window.innerWidth || 1024;
    CH = cv.clientHeight || window.innerHeight || 768;
    SCALE = Math.max(2, Math.round(CW / TARGET_W));
    W = Math.max(1, Math.ceil(CW / SCALE)); H = Math.max(1, Math.ceil(CH / SCALE));
    cv.width = W; cv.height = H;
    ctx.imageSmoothingEnabled = false;
    img = ctx.createImageData(W, H);
  }

  // Bayer 8x8 (0..1)
  const BN = 8;
  const BAYER = (() => {
    const m=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],
             [12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],
             [3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],
             [15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
    const f=new Float32Array(64);
    for(let y=0;y<8;y++)for(let x=0;x<8;x++)f[y*8+x]=(m[y][x]+0.5)/64;
    return f;
  })();
  const LEVELS = 5, SPREAD = 1/(LEVELS-1);

  function hsv(h,s,v){
    h=(h%1+1)%1; const i=Math.floor(h*6),f=h*6-i;
    const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
    switch(i%6){ case 0:return[v,t,p]; case 1:return[q,v,p]; case 2:return[p,v,t];
      case 3:return[p,q,v]; case 4:return[t,p,v]; default:return[v,p,q]; }
  }
  const qd=(val,thr)=>{ let x=val+thr*SPREAD; x=Math.round(x*(LEVELS-1))/(LEVELS-1);
    return (x<0?0:x>1?1:x)*255|0; };
  const smooth=t=>t<=0?0:t>=1?1:t*t*(3-2*t);

  // ---- reveal: the rainbow grows from the centre to fill the screen ----
  const REVEAL_MS = 7000;   // slow fill
  const EDGE = 0.16;        // width of the dithered reveal front
  let start = performance.now();

  function frame(now){
    const time = (now-start)/1000;
    const coverage = smooth(Math.min(1, (now-start)/REVEAL_MS));
    const front = coverage*(1+EDGE);          // reaches 1+EDGE -> full screen
    const d = img.data;
    const cx=W*0.5, cy=H*0.5, invMax=1/Math.hypot(W*0.5, H*0.5);
    for(let y=0;y<H;y++){
      const by=(y%BN)*BN, ny=y/H;
      for(let x=0;x<W;x++){
        const o=(y*W+x)<<2, thr=BAYER[by+(x%BN)];
        const nd=Math.hypot(x-cx, y-cy)*invMax;         // 0 centre -> 1 corner
        const edge=(front-nd)/EDGE;                     // dithered growing front
        if(edge > thr){
          const hue=(x/W*0.62 + ny*0.26 + time*0.035) % 1;   // drifting rainbow
          const c=hsv(hue, 0.95, 1);
          d[o]=qd(c[0],thr); d[o+1]=qd(c[1],thr); d[o+2]=qd(c[2],thr); d[o+3]=255;
        } else { d[o]=255; d[o+1]=255; d[o+2]=255; d[o+3]=255; }  // white until revealed
      }
    }
    ctx.putImageData(img,0,0);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
